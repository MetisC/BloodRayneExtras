[Powers]
; All powers and combos unlocked at new game start. 0 = No | 1 = Yes
all=0
[Challenge]
; Autokill=1  <- test-only: makes Rayne invincible + auto-clears waves
[Debug]
; Trace=1  <- writes diagnostics to br1mod_trace.log (default off;
;             real errors are always logged for support)
[Appearance]
; Model swaps applied when a challenge mission launches (model only, same skeleton).
; Soldier= / Elite= : any CSoldier model - SOLDIER, SS_SOLDIER, SS_OFFICER,
;   GGG_OFFICER, GGG_ELITE, GGG_HAZMAT, GGG_JETPACK, STALKER, ARGSLAVE,
;   ARGSLAVESHIRT, NAZI_BARROCK  (all .DFM) - arenas only.
; Skin= : player model for the WHOLE game (the "Apariencia" menu row edits this):
;   Default | Rayne | Mynce | Butcheress
;   Default = Rayne in the arenas, completely stock in the story campaign.
;   Mynce/Butcheress apply everywhere, campaign included. Only Rayne can
;   use firearms - the other skins fight with blades/blade arms only.
Skin=Default
; Examples:
;Soldier=SS_SOLDIER.DFM
;Elite=GGG_ELITE.DFM
;Skin=Mynce
