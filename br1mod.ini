[Powers]
; All powers and combos unlocked at new game start. 0 = No | 1 = Yes
all=0
[Challenge]
; Autokill=1  <- test-only: makes Rayne invincible + auto-clears waves
[Appearance]
; Model swaps applied when a challenge mission launches (model only, same skeleton).
; Soldier= / Elite= : any CSoldier model - SOLDIER, SS_SOLDIER, SS_OFFICER,
;   GGG_OFFICER, GGG_ELITE, GGG_HAZMAT, GGG_JETPACK, STALKER, ARGSLAVE,
;   ARGSLAVESHIRT, NAZI_BARROCK  (all .DFM)
; Boss= : pick a full dhampir boss by name, or a model swap:
;   Hero names (CMainCharacter + heroType, own AI/animations):
;     Mynce       - Rayne's mentor (maroon suit, MENTOR.SKL)
;     Butcheress  - the rooftop boss
;     Rayne       - standard Rayne model
;     RayneLA     - Rayne's Act-1 outfit
;   .DFM names: any CSoldier model above, or NPC models (BUTCHERESS.DFM,
;   KRISTINE.DFM, KAZI.DFM, GMONEY.DFM, HICKS.DFM, OLDMAN.DFM, BATMITE.DFM,
;   RAYNE.DFM, VAMPETTE.DFM, VAMP.DFM) - NPC models turn the boss into a
;   CNPC actor automatically (unarmed NPC behavior).
; Skin= : player model via heroType (the "Apariencia" menu row edits this):
;   Rayne | Mynce | Butcheress | RayneLA  — applies to all arenas
; Examples:
;Soldier=SS_SOLDIER.DFM
;Elite=GGG_ELITE.DFM
;Boss=Mynce
;Boss=BUTCHERESS.DFM
;Skin=Mynce
